# Release signing. Runs when a version tag is pushed or a release is published.
# Supply-chain rules:
#   - Build the page with the same Node.js build and the same scripts as CI.
#   - Sign dist/SHA256SUMS.txt with cosign sign-blob. GitHub provides the OIDC token.
#   - No signing key and no repository secret.
#   - The two actions are pinned to full commit SHAs.
#   - The token can update the release and request an OIDC token. Nothing else.
# The certificate identity is:
#   https://github.com/nosistech/nosis-bunker/.github/workflows/release.yml@refs/tags/vX.Y.Z
# The OIDC issuer is https://token.actions.githubusercontent.com
# Renaming this file changes the identity. Update the page, README.md and SECURITY.md with it.
name: release
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
permissions:
  contents: write
  id-token: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Get the code (pinned action)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install Node.js 24.22.1 (official build, SHA-256 pinned, no third-party action)
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-x64.tar.xz
          echo "6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6  node-v24.22.1-linux-x64.tar.xz" | sha256sum -c -
          tar -xJf node-v24.22.1-linux-x64.tar.xz
          echo "$RUNNER_TEMP/node-v24.22.1-linux-x64/bin" >> "$GITHUB_PATH"
      - name: Node.js version gate
        run: node tools/check-node.js
      - name: Build the page and the website folder
        run: node tools/build.js && node tools/site.js
      - name: The committed dist and site files must match a fresh build
        run: git diff --exit-code -- dist/ site/
      - name: Install cosign 3.1.4 (pinned action)
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Sign SHA256SUMS.txt and check the signature
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            printf 'Refusing to sign %s. The tag must look like v1.2.3.\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/tags/$GITHUB_REF_NAME" ]; then
            printf 'Refusing to sign ref %s.\n' "$GITHUB_REF" >&2
            exit 1
          fi
          STAGE="$RUNNER_TEMP/bunker-release"
          mkdir -p "$STAGE"
          cp dist/nosis-bunker.html dist/SHA256SUMS.txt "$STAGE/"
          printf 'Certificate identity: %s\n' "$IDENTITY"
          cosign sign-blob --yes --oidc-provider github-actions \
            --bundle "$STAGE/SHA256SUMS.txt.sigstore.json" \
            "$STAGE/SHA256SUMS.txt"
          cosign verify-blob \
            --bundle "$STAGE/SHA256SUMS.txt.sigstore.json" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$STAGE/SHA256SUMS.txt"
          echo "RELEASE_STAGE=$STAGE" >> "$GITHUB_ENV"
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RELEASE_STAGE"
          NOTES='Bunker HTML file and its SHA-256 checksum. SHA256SUMS.txt.sigstore.json is a Sigstore signature of SHA256SUMS.txt. Check it with the steps in SECURITY.md.'
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
              nosis-bunker.html SHA256SUMS.txt SHA256SUMS.txt.sigstore.json
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes "$NOTES" \
              nosis-bunker.html SHA256SUMS.txt SHA256SUMS.txt.sigstore.json
          fi
